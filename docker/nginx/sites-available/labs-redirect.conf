# labs.judaicalink.org -> Erklaerseite auf der statischen Website
#
# Labs wird abgeloest vom Produktivbetrieb im FID-Portal in Frankfurt.
# Bis zur Abschaltung werden alle Anfragen auf /labs/ umgeleitet, wo der Umzug
# erklaert und auf die entsprechenden Angebote in Frankfurt verwiesen wird.
#
# 302 und nicht 301: solange offen ist, ob Mannheim spaeter wieder
# Demonstratoren unter dieser Adresse anbietet, sollte die Umleitung
# widerrufbar bleiben. Nach der Entscheidung ggf. auf 301 heben.

server {
    listen 80;
    listen [::]:80;
    server_name labs.judaicalink.org;

    return 302 https://web.judaicalink.org/labs/;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name labs.judaicalink.org;

    # ssl_certificate     /etc/letsencrypt/live/labs.judaicalink.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/labs.judaicalink.org/privkey.pem;

    return 302 https://web.judaicalink.org/labs/;
}

# search.judaicalink.org wurde von der alten Suche auf der statischen Seite
# genutzt. Die Suche ist entfernt, der Dienst kann abgeschaltet werden.
# Bis dahin ebenfalls auf die Suchseite umleiten.
server {
    listen 80;
    listen [::]:80;
    server_name search.judaicalink.org;

    return 302 https://web.judaicalink.org/search/;
}
