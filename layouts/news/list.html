{{ partial "header.html" . }}
<!-- the news page: the posts as cards, 12 per page -->
<main class="row">
    <div class="col-12">
        <h1 class="text-center text-md-left">News</h1>
        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3">
            {{ range (.Paginate .Pages 12).Pages }}
            <div class="col mb-4">
                <div class="card h-100">
                    {{ partial "news-image.html" (dict "page" . "link" true) }}
                    <div class="card-body d-flex flex-column">
                        <div><span class="badge badge-pill bg-info">{{ .Date.Format "2 Jan 2006" }}</span></div>
                        <h4 class="uppercase mt-2"><a href="{{ .Permalink }}">{{ .Title }}</a></h4>
                        <div class="card-text my-3">{{ .Summary }}</div>
                        <div class="d-flex justify-content-end mt-auto">
                            <a class="btn btn-secondary" href="{{ .Permalink }}">read more</a>
                        </div>
                    </div>
                </div>
            </div>
            {{ end }}
        </div>
        <nav class="d-flex justify-content-center" aria-label="News pages">
            {{ template "_internal/pagination.html" . }}
        </nav>
    </div>
</main>
{{ partial "footer.html" . }}
